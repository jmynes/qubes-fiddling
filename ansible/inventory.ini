# ============================================================
# Qubes OS 4.3 Inventory
# ============================================================
# - Use qube names exactly as shown in `qvm-ls`
# - Groups represent roles (vpn, gpu, secure), not distros
# - Put uncategorized qubes in [misc] until they get a real role
# ============================================================

[all:vars]
latest_debian=debian-13-xfce
latest_fedora=fedora-42-xfce

# --------------------
# Android Qubes, such as Waydroid
# --------------------
[android]
# parent group (membership via :children)

[android:children]
app_android
template_android

[app_android]
maple-idle-rpg

# --------------------
# Qubes with GPU Passthrough (boot one at a time)
# --------------------
[gpu_passthrough]
# parent group (membership via :children)

[gpu_passthrough:children]
gpu_linux
gpu_windows

[gpu_linux]
steam-debian

[gpu_windows]
romhacking-hma
win10-pro-gpu-passthrough

# --------------------
# Uncategorized / staging area
# --------------------
[misc]
banking
discord
personal
signal
spotify
vscode-ide
windows-mgmt
work

# --------------------
# StandaloneVMs
# --------------------
[standalone]
# parent group (membership via :children)

[standalone:children]
standalone_windows

[standalone_windows]
WinXP-32bit
WinXP-64bit

# --------------------
# TemplateVMs
# --------------------
[templates]
# parent group (membership via :children)

[templates:children]
template_android
template_community
template_custom
template_defaults
template_derivative
template_windows

# Android Templates
[template_android]
d13-waydroid-arm
d13-waydroid-x86

# Default Templates on install
[template_community]
archlinux

# Custom Templates per forum guides
[template_custom]
# currently a parent group (membership via :children), but not necessarily by design
#openbsd
#ubuntu, etc

[template_custom:children]
template_android

# Default Templates on install
[template_defaults]
debian-13-xfce
fedora-42-xfce
whonix-gateway-18
whonix-workstation-18

# Templates forked from other Templates
[template_derivative]
archlinux-closed-source
archlinux-signal
debian-13-gaming
fedora-42-adb-and-codecs
fedora-42-ansible
fedora-42-vpn
fedora-42-tailscale
fedora-42-vscode

# Windows Templates
[template_windows]
win10-pro-x64
win10-pro-gpu-passthrough
win7-ult-x64

# --------------------
# USB controller qubes (sometimes useful for passthrough)
# --------------------
[usb_provider]
sys-usb
sys-usb-2
sys-usb-3

# --------------------
# Qubes with a passed through USB controller or device (watch for conflicts when booting)
# --------------------
[usb_passthrough]
android-adb

# --------------------
# VPN / privacy boundary qubes
# --------------------
[vpn_service]
sys-vpn
sys-tailnet
sys-whonix

# --------------------
# Windows Qubes
# --------------------
[windows]
# parent group (membership via :children)

[windows:children]
app_windows
standalone_windows
template_windows

