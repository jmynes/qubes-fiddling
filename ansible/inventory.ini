# ============================================================
# Qubes OS 4.3 Inventory
# ============================================================
# - Use qube names exactly as shown in `qvm-ls`
# - Groups represent roles (vpn, gpu, secure), not distros
# - Put uncategorized qubes in [misc] until they get a real role
# ============================================================

[appvms]
# parent group (membership via :children)

[all:vars]
latest_debian=debian-13-xfce
latest_fedora=fedora-42-xfce

[appvms:children]
android_appvms
linux_appvms
servicevm_appvms
windows_appvms

[appvms:vars]
klass=AppVM
template_to_use=latest_fedora

# --------------------
# Android Qubes, such as Waydroid
# --------------------
[android]
# parent group (membership via :children)

[android:children]
android_appvms
android_templatevms

[android_appvms]
maple-idle-rpg

# --------------------
# Qubes with GPU Passthrough (boot one at a time)
# --------------------
[gpu_passthrough]
# parent group (membership via :children)

[gpu_passthrough:children]
gpu_linux
gpu_windows

[gpu_linux]
droid-vscode-gpu
steam-debian

[gpu_windows]
romhacking-hma
win10-pro-gpu-passthrough

# --------------------
# Linux AppVMs without another category
# --------------------
[linux_appvms]
anon-whonix
banking
cursor-ide
discord
personal
signal
spotify
untrusted
vault
vscode-ide
windows-mgmt
work

# --------------------
# StandaloneVMs
# --------------------
[standalonevms]
# parent group (membership via :children)

[standalonevms:vars]
klass=StandaloneVM

[standalonevms:children]
windows_standalonevms

[windows_standalonevms]
WinXP-32bit
WinXP-64bit

# --------------------
# ServiceVMs
# --------------------
[servicevm_appvms]
# parent group (membership via :children)

[servicevm_appvms:children]
net_providers
usb_providers

# --------------------
# TemplateVMs
# --------------------
[templatevms]
# parent group (membership via :children)

[templatevms:vars]
klass=TemplateVM
netvm=""

[templatevms:children]
android_templatevms
community_templatevms
custom_templatevms
default_templatevms
derivative_templatevms
windows_templatevms

# Android Templates
[android_templatevms]
d13-waydroid-arm
d13-waydroid-x86

# Default Templates on install
[community_templatevms]
archlinux

# Custom Templates per forum guides
[custom_templatevms]
# currently a parent group (membership via :children), but not necessarily by design
#openbsd
#ubuntu, etc

[custom_templatevms:children]
android_templatevms

# Default Templates on install
[default_templatevms]
debian-13-xfce
fedora-42-xfce
whonix-gateway-18
whonix-workstation-18

# Templates forked from other Templates
[derivative_templatevms]
archlinux-closed-source
archlinux-signal
debian-13-droid-vscode-gpu
debian-13-gaming
debian-13-openvpn
fedora-42-adb-and-codecs
fedora-42-ansible
fedora-42-cursor
fedora-42-vpn
fedora-42-tailscale
fedora-42-vscode

# Windows Templates
[windows_templatevms]
win10-pro-x64
win10-pro-gpu-passthrough
win7-ult-x64

# --------------------
# NetVM qubes (sometimes useful for passthrough)
# --------------------
[net_providers]
sys-firewall
sys-firewall-localnet
sys-net

[net_providers:children]
vpn_net_providers

[vpn_net_providers]
sys-CUI-vpn
sys-vpn
sys-tailnet
sys-whonix

# --------------------
# Qubes with a passed through USB controller or device (watch for conflicts when booting)
# --------------------
[usb_passthrough]
android-adb

# --------------------
# USB controller qubes (sometimes useful for passthrough)
# --------------------
[usb_providers]
sys-usb
sys-usb-2
sys-usb-3

# --------------------
# Windows Qubes
# --------------------
[windows]
# parent group (membership via :children)

[windows:children]
windows_appvms
windows_standalonevms
windows_templatevms

