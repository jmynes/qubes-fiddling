# Defaults for the windows-qube role.
# Shared resources_* / win_iso / answer-file vars must match the
# windows-mgmt-setup role; override both in the playbook.

# ----------------------------
# The Windows qube to produce
# ----------------------------
win_qube_name: "win10-airgapped"
# StandaloneVM for a self-contained qube; TemplateVM to base AppVMs on it later.
win_qube_klass: "StandaloneVM"
# Inventory convention: [windows:vars] label=blue
win_qube_label: "blue"
win_memory_mb: 12288         # initial RAM; maxmem 0 keeps balancing OFF
win_vcpus: 2
win_root_size_gib: 60
win_private_size_gib: 20
# Upstream uses 999999: first boots can run chkdsk etc. for a very long time.
win_qrexec_timeout: 999999
# The 40-windows-airgapped.policy deny rules match on this tag.
win_tags: ["airgapped-windows"]

# ----------------------------
# Display / resolution
# ----------------------------
# Two parts, both safe (no live mode switch):
#   1. gui-videoram-min (main.yml) = w*h*4/1024 KiB sizes the GUI framebuffer so
#      the mode is selectable without running out of video RAM; fullscreen on.
#   2. post-setup writes QWT's registry FullscreenWidth/Height so the qube BOOTS
#      at this size (QWT reads them on startup; this persists across reboots).
# The QWT video driver must actually offer the mode. 2048x1152 IS a preset in
# this qube's driver; if a given QWT build lacks the mode, Windows snaps to the
# nearest supported one. Set "" or "0x0" to leave Qubes/QWT defaults.
#
# The playbook NEVER does a live resolution change (only registry + videoram):
# changing modes repeatedly or too quickly can lock up the QWT driver until the
# qube is rebooted.
win_max_resolution: "2048x1152"

# ----------------------------
# Installation behavior
# ----------------------------
# Per pass: how long to wait for Windows setup to finish (it ends in a guest
# reboot, which Qubes reports as a shutdown) before giving up.
win_install_timeout_secs: 10800
# How long to wait for the qube to register as running after qvm-start.
win_boot_register_timeout_secs: 300
# How long to wait for QWT to advertise itself (feature os == Windows).
win_qwt_ready_timeout_secs: 1800
# DANGER: re-runs the installation passes even on a provisioned qube,
# which wipes it (the answer file repartitions disk 0).
win_force_reinstall: false

# ----------------------------
# Post-install scripts (run inside Windows, best-effort like upstream)
# ----------------------------
# optimize.bat ALSO disables Windows Defender + SmartScreen and runs
# `netsh advfirewall ... allowinbound,allowoutbound` (opens the Windows host
# firewall). Upstream justifies that with "the netVM acts as its firewall" -
# but this qube has NO netVM, so that rationale is void and it is pure
# defense-in-depth loss. Default OFF for the hardened profile; opt in only if
# you understand the tradeoff (and never for a Windows TemplateVM whose AppVMs
# would inherit a disabled AV/firewall).
win_run_optimize: false
win_run_spyless: true    # spyless.bat: disable CEIP/WER/DiagTrack telemetry (purely good for airgap)
win_run_seamless: false  # seamless.bat: experimental QWT GUI driver - keep off for hardened qubes

# ----------------------------
# WARP/DWM redraw fix: processor-group size (bcdedit groupsize) -- THE root fix
# ----------------------------
# Fixes this qube's >2-vCPU redraw corruption (black/stale static regions,
# drag-select staircase trails). GPU-less Win10 22H2 falls back to the Microsoft
# Basic Display Adapter, so DWM composites the whole desktop in software via WARP
# (d3d10warp.dll). WARP sizes its compositor thread pool to the ENUMERATED
# processor count; at 3+ vCPUs it multithread-composites and RACES on static
# regions -> stale/black pixels. Hard 2-vs-3 cliff (clean <=2, broken 3+).
#
# `bcdedit /set groupsize 2` splits the vCPUs into 2-logical-processor PROCESSOR
# GROUPS without disabling any core (unlike numproc, which parks them). On Win10
# 22H2 a process defaults to its home group, and the legacy GetSystemInfo (the
# only processor-count API d3d10warp.dll imports) returns just that group's
# count, so WARP always sees 2 -> 2-wide pool -> clean. Verified at 16 vCPU:
# TotalOnline=16 Groups=8 ProcView=2 Packages=1 (all cores online). Applied in
# post-setup (effective on the NEXT boot). Largely SUPERSEDES the separate
# windows-redraw-fix RedrawWindow-hook role -- drop that hook from the playbook.
#
# CAVEATS: Win10-ONLY -- do NOT upgrade the guest to Win11/Server2022 (they span
# all groups by default -> WARP re-enumerates every vCPU -> bug returns). Not
# durable across Windows feature/in-place upgrades (re-assert via this role).
# Each group is 2 CPUs, so any SINGLE non-group-aware process is capped at 2
# cores; aggregate multi-PROCESS throughput is unaffected (Windows round-robins
# new processes across groups). ~20-group cap -> ~40 vCPU ceiling.
# Set 0 or "" to skip (e.g. if you instead cap win_vcpus <= 2, or run Win11).
win_warp_groupsize: 2

# Stubdomain RAM (MiB) -- mitigates the SEPARATE "Issue 1" gui-vchan freeze
# (libvchan_is_eof: freeze + partial blank + window jumps to the active monitor
# under heavy GUI load). The default is tight; "" leaves the Qubes default.
# Distinct from the redraw fix above. The upstream #9847 freeze fix ships in
# xen-hvm-stubdom-linux >= 4.3.4 (check `rpm -qf` on the stubdom rootfs).
win_stubdom_mem: 512

# ----------------------------
# Native in-guest GUI agent -- DISABLED (superseded; kept for documentation)
# ----------------------------
# We tried switching to the experimental QWT in-guest GUI agent (gui=1 + clear
# gui-emulated) to dodge the emulated path. On this setup it did NOT reliably
# engage (gui-emulated re-stamps on boot; the qube stayed emulated), and the
# redraw bug it was meant to help is now fixed at the root by win_warp_groupsize.
# Left OFF. (As a possible Issue-1 fallback only: the Win10 native agent has no
# display driver -> stuck at a tiny fixed resolution, so it's a poor trade.)
# Its post-setup tasks (and files/install-gui-agent.ps1) have been removed.
win_native_gui_agent: false

# ----------------------------
# Shared with windows-mgmt-setup (keep in sync via playbook vars)
# ----------------------------
resources_qube: "windows-mgmt"
resources_dir: "/home/user/qvm-create-windows-qube"
win_iso_filename: "win10x64-pro.iso"

# Where qvm-copy-to-vm lands the post scripts inside Windows.
post_incoming_dir: '%USERPROFILE%\Documents\QubesIncoming\{{ resources_qube }}\post'
